name: Update Third-Party Notices

on:
  push:
    branches:
      - master
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  update-notices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-licenses
        run: |
          pip install pip-licenses

      - name: Generate THIRD-PARTY-NOTICES.txt
        run: |
          pip-licenses \
            --format=plain-vertical \
            --with-license-file \
            --with-notice-file \
            --no-license-path \
            --output-file=THIRD-PARTY-NOTICES.txt

      - name: Commit changes
        run: |
          if git diff --quiet -- THIRD-PARTY-NOTICES.txt; then
            echo "THIRD-PARTY-NOTICES.txt is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add THIRD-PARTY-NOTICES.txt
          git commit -m "chore: update third-party notices"
          git push
